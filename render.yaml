services:
  - type: web
    name: flighthunter-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SERPAPI_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: DATABASE_URL
        sync: false
