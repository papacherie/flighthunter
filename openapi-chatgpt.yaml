openapi: 3.1.0
info:
  title: FlightHunter AI
  version: 7.0.0
  description: Recherche mondiale Google Flights via SerpApi. Vise six offres ou plus si disponibles; jusqu’à 9 requêtes par recherche. Pas de réservation, aucun tarif garanti.
servers:
  - url: https://flighthunter-ai.onrender.com
paths:
  /api/search:
    post:
      operationId: searchFlights
      summary: Comparer des allers-retours pour des aéroports du monde entier et voyageurs de tout âge
      security:
        - PrivateCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, destination, departure, return, adults, children_ages, stops]
              properties:
                origin:
                  type: string
                  description: Code IATA unique (CDG), liste (CDG,ORY), ou identifiant de ville Google Flights (/m/...).
                  example: CDG
                destination:
                  type: string
                  description: Code IATA ou identifiant de ville Google Flights.
                  example: HND
                departure: {type: string, format: date, example: '2027-07-29'}
                return: {type: string, format: date, example: '2027-08-20'}
                adults: {type: integer, minimum: 1, maximum: 8, description: Nombre de voyageurs majeurs (18 ans et plus).}
                children_ages:
                  type: array
                  maxItems: 7
                  description: Chaque âge à la date du départ ; les 12–17 ans sont classés par Google Flights dans les adultes tarifaires.
                  items:
                    type: object
                    required: [age]
                    properties:
                      age: {type: integer, minimum: 0, maximum: 17}
                      seat: {type: boolean, description: Bébé 0–1 an avec siège (true) ou sur les genoux (false) ; ignoré à partir de 2 ans.}
                stops: {type: string, enum: [any, '0', '1', '2']}
      responses:
        '200':
          description: Offres indicatives et liens de recherche ; prix non garantis.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /api/airline-link:
    post:
      operationId: airlineBookingLink
      summary: Obtenir une option de réservation compagnie pour une offre déjà retrouvée.
      description: Déclenche une requête SerpApi supplémentaire; n'effectue pas de réservation. Lorsque la compagnie n'a pas de lien exploitable, renvoie un lien Google Flights en fallback.
      security: [{PrivateCode: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offer_id]
              properties:
                offer_id: {type: string, description: Identifiant d'offre obtenu précédemment via searchFlights.}
      responses:
        '200':
          description: Lien de réservation externe contrôlé ou lien de recherche de secours.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /api/airports:
    get:
      operationId: searchAirports
      summary: Suggestions de villes et d'aéroports via SerpApi (potentiellement facturables)
      security: [{PrivateCode: []}]
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 3, maxLength: 70}
      responses:
        '200':
          description: Suggestions d'aéroports et villes, sans résultat de vol.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /api/history:
    get:
      operationId: listSavedFlightSearches
      summary: Lister les recherches privées sauvegardées (ne consomme aucun crédit SerpApi)
      security: [{PrivateCode: []}]
      responses:
        '200':
          description: Derniers résultats enregistrés, avec prix indicatifs historiques.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /api/history/{id}:
    get:
      operationId: getSavedFlightSearch
      summary: Retrouver le résultat exact d'une recherche déjà sauvegardée
      security: [{PrivateCode: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{24}$'}
      responses:
        '200':
          description: Instantané privé, date de collecte et liens Google Flights.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    delete:
      operationId: deleteSavedFlightSearch
      summary: Effacer un instantané privé
      security: [{PrivateCode: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{24}$'}
      responses:
        '200': {description: Instantané supprimé.}
  /api/history/{id}/refresh:
    post:
      operationId: refreshSavedFlightSearch
      summary: Actualiser une recherche ancienne (requêtes SerpApi facturables)
      description: Ne modifie pas l'ancien instantané, crée un nouveau lien privé daté. Jusqu'à 9 appels SerpApi.
      security: [{PrivateCode: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{24}$'}
      responses:
        '200':
          description: Nouveaux résultats indicatifs et nouveau history_url.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
components:
  securitySchemes:
    PrivateCode:
      type: apiKey
      in: header
      name: X-Access-Code
