openapi: 3.1.0
info:
  title: FlightHunter AI
  version: 2.0.0
  description: Recherche de vols Google Flights via SerpApi, avec retour contrôlé, sans réservation ni garantie des prix.
servers:
  - url: https://flighthunter-ai.onrender.com
paths:
  /api/search:
    post:
      operationId: searchFlights
      summary: Trouver des allers-retours indicatifs pour plusieurs voyageurs
      security:
        - PrivateCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, destination, departure, return, adults, children, stops]
              properties:
                origin: {type: string, example: PAR}
                destination: {type: string, enum: [ALL, PVG, SHA]}
                departure: {type: string, format: date}
                return: {type: string, format: date}
                adults: {type: integer, minimum: 1, maximum: 6}
                children: {type: integer, minimum: 0, maximum: 3}
                stops: {type: string, enum: [any, '0', '1', '2']}
      responses:
        '200':
          description: Offres triées et liens de recherche, avec prix non garantis si API configurée.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    PrivateCode:
      type: apiKey
      in: header
      name: X-Access-Code
